    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      Hard version gate for Telegram WebView.
      Telegram's WebView is notorious for holding onto an old Service Worker
      that keeps serving a previous build (stale JS + stale HTML = blank or
      "could not render" screens). We embed a fresh build id at every deploy;
      if the running copy doesn't match what's stored, we nuke every cache and
      the Service Worker, then reload once. index.html itself is always served
      from the network (see vercel.json: max-age=0, must-revalidate), so this
      script is guaranteed to run the newest version.
    -->
    <script>
      (function () {
        // __BUILD_ID__ is replaced at build time by scripts/stamp-build-id.mjs.
        var BUILD_ID = '__BUILD_ID__';
        var STORAGE_KEY = 'roadlive_build_id';
        var SWITCHING_KEY = 'roadlive_build_switching';
        try {
          var stored = localStorage.getItem(STORAGE_KEY);
          var switching = sessionStorage.getItem(SWITCHING_KEY);

          if (stored === BUILD_ID) {
            // Up to date: clear any in-flight switch marker and carry on.
            sessionStorage.removeItem(SWITCHING_KEY);
            return;
          }

          // A new deploy landed. We purge caches + SW and reload exactly ONCE.
          // If we already triggered a reload for this build and the running copy
          // STILL doesn't match, stop — looping forever would trap the user on a
          // spinner. The stale copy still renders; the next cold open fixes it.
          if (switching === BUILD_ID) {
            sessionStorage.removeItem(SWITCHING_KEY);
            localStorage.setItem(STORAGE_KEY, BUILD_ID);
            return;
          }

          sessionStorage.setItem(SWITCHING_KEY, BUILD_ID);
          localStorage.setItem(STORAGE_KEY, BUILD_ID);

          var done = function () { window.location.reload(); };
          var clearAll = 'caches' in window
            ? caches.keys().then(function (names) {
                return Promise.all(names.map(function (n) { return caches.delete(n); }));
              })
            : Promise.resolve();

          clearAll.then(function () {
            if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
              navigator.serviceWorker.getRegistrations()
                .then(function (regs) { return Promise.all(regs.map(function (r) { return r.unregister(); })); })
                .then(done, done);
            } else {
              done();
            }
          });
        } catch (e) {
          /* localStorage may be unavailable — version gate just no-ops. */
        }
      })();
    </script>
